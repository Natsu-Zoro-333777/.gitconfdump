[opener]
edit = [
  { run = '~/.config/yazi/scripts/nvim-open.sh %s', block = true, desc = "nvim" },
]
swayimg = [
  { run = 'swayimg %s', orphan = true, desc = "swayimg" },
]

[open]
prepend_rules = [
  { mime = "image/*", use = [ "swayimg" ] },
  { mime = "text/*", use = [ "edit" ] },
  { mime = "inode/x-empty", use = [ "edit" ] },
  { mime = "application/{json,javascript,toml,x-yaml,xml}", use = [ "edit" ] },
]
